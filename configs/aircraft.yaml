# ------ root_path/dataset_name ------
root_path: '../data'


# ------ Load Cache and Features ------
load_cache: False
load_pre_feat: False

# load_cache: True
# load_pre_feat: True


# ------ Hyperparamters ------
search_hp: True
# search_hp: False

seed: 42

data_split_json: ''
search_scale: [30, 30]  # beta, alpha / [12, 10]
search_step: [200, 50]

init_beta: 1 #1
init_alpha: 5 #5


# ------ Basic Config ------
dataset: 'aircraft'
ways: 5  # random 5-way || -1 for all
shots: 5
backbone: "RN50" #'RN50'

lr: 0.001
augment_epoch: 2
train_epoch: 10
entropy_weight: 0.1
contrast_weight: 0.01