# ------ root_path/dataset_name ------
root_path: '../data'


# ------ Load Cache and Features ------
load_cache: False
load_pre_feat: False

# load_cache: True
# load_pre_feat: True


# ------ Hyperparamters ------
search_hp: True
# search_hp: False

seed: 1

data_split_json: 'split_fgscr42_2.json'
search_scale: [12, 500]  # beta, alpha / [12, 10]
search_step: [200, 50]

init_beta: 1 #1
init_alpha: 100 #5

# ------ Basic Config ------
dataset: 'fgscr42'
ways: -1  # random 5-way || -1 for all || [3,10,16,18,22]
shots: 16
backbone: "RN50" # RN50 || ViT-B/32 || ViT-L/14

lr: 0.0005
augment_epoch: 2
train_epoch: 10
entropy_weight: 0.1
contrast_weight: 0.01